name: Create GitHub Issues Batch

on:
  workflow_dispatch:
    inputs:
      issue_file:
        description: 'Path to the issues batch file'
        required: false
        default: 'GITHUB_ISSUES_BATCH.md'

jobs:
  create-issues:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Create GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python scripts/create_issues.py ${{ github.event.inputs.issue_file }}
